# Verifie que norvika.ca se construit, a chaque envoi sur n'importe quelle branche.
#
# ⚠️ CETTE ACTION NE DEPLOIE PLUS (depuis le 2026-11-15).
# Le deploiement est fait par Workers Builds, chez Cloudflare : le Worker « norvika »
# est relie au depot NORVIKA/norvika, branche next16-migration, commande
# `npm run deploy` (scripts/deploy.sh). Il part a chaque push sur cette branche ET a
# chaque « Publier » dans Sanity (webhook vers le Deploy Hook du Worker).
# Raison : aucun jeton Cloudflare ne vit plus dans GitHub. L'ancien deploiement d'ici
# gardait un jeton capable de modifier le compte Cloudflare dans les secrets du depot.
#
# Ce qui reste ici : types, style de code et construction, pour qu'une erreur se
# voie sur une branche de travail avant d'atteindre la production.

name: Verifier la construction

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  # Une seule verification a la fois par branche ; la plus recente remplace l'ancienne.
  group: verification-norvika-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier les types
        run: npm run typecheck

      - name: Verifier le style de code
        run: npm run lint

      # ⚠️ Les variables NEXT_PUBLIC_* sont FIGEES DANS LE CODE au moment de la
      # construction. Sans elles ici, /admin partirait en ligne sans adresse de
      # base et la connexion casserait. Ce ne sont pas des secrets : elles
      # partent de toute facon dans le navigateur, la protection vient des
      # regles RLS. D'ou des « variables » de depot et non des « secrets ».
      - name: Construire pour Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
